name: Publish extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version
        run: |
          python - <<'PY'
          import json
          import os

          with open("manifest.json", encoding="utf-8") as file:
              version = json.load(file)["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(
                  f"Version mismatch: tag={tag}, manifest={version}"
              )
          PY

      - name: Run tests
        run: npm test

      - name: Build ZIP
        run: python tools/package-release.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/attendance-helper.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes